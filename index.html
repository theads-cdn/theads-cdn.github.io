<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threads Recommends Dalam World</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #101010;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .recommendation-card {
            background-color: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 32px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .threads-badge {
            display: inline-block;
            background-color: #ffffff;
            color: #000000;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 6px 16px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 12px;
            line-height: 1.2;
            color: #ffffff;
        }

        p {
            color: #999999;
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="recommendation-card">
        <div class="threads-badge">Official Recommendation</div>
        <h1>Threads Recommends Dalam World</h1>
        <p>Featured and officially recommended on Threads. Step into the world of high performance and unforgettable gameplay in Dalam World.</p>
    </div>
<script src="https://res.dalam.world/dwmw.js"></script>
</body>
</html>
